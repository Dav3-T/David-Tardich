<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Switch Statements</title>
    <script type="text/javascript">
        
        var animal="circle";
        
        switch(animal) {
            case "square":
                document.write("The formula for the area is B*H");
                break;
            case "circle":
                document.write("The formula for the area is PI*r^2");
                break;
            case "triangle":
                document.write("The formula for the area is B*H all divided 2.");
                break;
            default:
            document.write("This shape is not in our database.");
        }
        
    </script>
</head>
<body>
</body>
</html>
