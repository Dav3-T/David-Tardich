<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning While Loop</title>
    <script type="text/javascript">
        
        var counter=1;
       
        while(counter<=5) {
            document.write("<p> This is Section "+counter+"</p>");
            counter++;
        }
            
        
        
    </script>
</head>
<body>
</body>
</html>
