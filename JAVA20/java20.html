<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Do While Loop</title>
    <script type="text/javascript">
        
        var counter=16;
        //added an if statement
        if (counter >= 5) {
            do {
                document.write(" This is Line "+counter+"<br/>");
                counter++;
                // changed while integer
            }while(counter<=19)
        }
    
    </script>
</head>
<body>
</body>
</html>
